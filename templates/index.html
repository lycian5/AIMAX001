<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>기사 소재 수집 및 작성 AI 직원</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 16px;
    }

    .container {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 820px;
      overflow: hidden;
    }

    .header {
      background: #1a56db;
      color: #fff;
      padding: 24px 32px;
    }

    .header h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    .header p  { font-size: 13px; opacity: 0.85; }

    /* ── 단계 표시 ── */
    .steps {
      display: flex;
      align-items: center;
      padding: 20px 32px;
      border-bottom: 1px solid #e5e7eb;
      gap: 0;
    }

    .step {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
    }

    .step-num {
      width: 28px; height: 28px;
      border-radius: 50%;
      border: 2px solid #d1d5db;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700;
      color: #9ca3af;
      flex-shrink: 0;
      transition: all 0.3s;
    }

    .step-label { font-size: 13px; color: #9ca3af; font-weight: 500; transition: all 0.3s; }

    .step-line {
      flex: 1;
      height: 2px;
      background: #e5e7eb;
      margin: 0 8px;
      transition: background 0.3s;
    }

    .step.active   .step-num   { border-color: #1a56db; background: #1a56db; color: #fff; }
    .step.active   .step-label { color: #1a56db; font-weight: 700; }
    .step.done     .step-num   { border-color: #059669; background: #059669; color: #fff; }
    .step.done     .step-label { color: #059669; }
    .step-line.done { background: #059669; }

    /* ── 공통 ── */
    .body { padding: 28px 32px; }

    label {
      display: block;
      font-size: 14px; font-weight: 600; color: #374151;
      margin-bottom: 8px;
    }

    .btn-primary {
      margin-top: 18px; width: 100%;
      padding: 14px; background: #1a56db;
      color: #fff; border: none; border-radius: 8px;
      font-size: 16px; font-weight: 700; cursor: pointer;
      font-family: inherit; transition: background 0.2s;
    }
    .btn-primary:hover:not(:disabled) { background: #1e429f; }
    .btn-primary:disabled { background: #93c5fd; cursor: not-allowed; }

    /* ── 경로 관리자 ── */
    .pm-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .pm-count {
      font-size: 12px;
      color: #6b7280;
      background: #f3f4f6;
      padding: 3px 10px;
      border-radius: 99px;
      font-weight: 500;
    }

    .pm-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 10px;
    }

    .pm-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 6px 6px 6px;
      border-radius: 10px;
      border: 2px solid transparent;
      transition: border-color 0.2s, background 0.2s;
    }

    .pm-row.selected {
      border-color: #bfdbfe;
      background: #f0f7ff;
    }

    .pm-row.new {
      animation: slideIn 0.25s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .pm-num {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #e5e7eb;
      color: #6b7280;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s, color 0.2s;
    }

    .pm-row.selected .pm-num {
      background: #1a56db;
      color: #fff;
    }

    .pm-input {
      flex: 1;
      padding: 10px 12px;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.2s, background 0.2s;
      min-width: 0;
    }

    .pm-input:focus {
      outline: none;
      border-color: #1a56db;
    }

    .pm-input.saved {
      border-color: #059669;
      background: #f0fdf4;
    }

    .pm-save-btn {
      padding: 8px 13px;
      background: #fff;
      border: 1.5px solid #d1d5db;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      color: #374151;
      font-family: inherit;
      transition: all 0.15s;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .pm-save-btn:hover { background: #f9fafb; border-color: #9ca3af; }
    .pm-save-btn.saved { border-color: #059669; color: #059669; background: #f0fdf4; }

    .pm-del-btn {
      width: 32px;
      height: 32px;
      background: #fff;
      border: 1.5px solid #e5e7eb;
      border-radius: 6px;
      font-size: 18px;
      cursor: pointer;
      color: #9ca3af;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      flex-shrink: 0;
      line-height: 1;
    }

    .pm-del-btn:hover { border-color: #fca5a5; color: #ef4444; background: #fff5f5; }

    /* ── 입력창 추가 드롭다운 버튼 ── */
    .pm-add-wrap {
      position: relative;
      margin-bottom: 6px;
    }

    .pm-add-btn {
      width: 100%;
      padding: 10px 16px;
      background: #f9fafb;
      border: 1.5px dashed #d1d5db;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      color: #1a56db;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.15s;
    }

    .pm-add-btn:hover:not(:disabled) { background: #eff6ff; border-color: #93c5fd; }
    .pm-add-btn:disabled { color: #9ca3af; cursor: not-allowed; border-color: #e5e7eb; background: #f9fafb; }

    .pm-add-btn-left { display: flex; align-items: center; gap: 6px; }
    .pm-add-icon { font-size: 16px; font-weight: 700; }

    .pm-add-hint {
      font-size: 11px;
      color: #9ca3af;
      font-weight: 400;
      background: #e5e7eb;
      padding: 2px 7px;
      border-radius: 99px;
    }

    /* ── 저장된 경로 힌트 ── */
    .pm-saved-hint {
      margin-top: 8px;
      font-size: 12px;
      color: #6b7280;
      min-height: 20px;
    }

    .pm-saved-hint span {
      display: inline-block;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 4px;
      padding: 2px 8px;
      margin: 2px 2px;
      cursor: pointer;
      color: #1e40af;
      font-size: 11px;
      transition: background 0.15s;
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      vertical-align: middle;
    }
    .pm-saved-hint span:hover { background: #dbeafe; }

    /* ── 검색 키워드 ── */
    .kw-wrap { margin-top: 16px; }

    .kw-input {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    .kw-input:focus { outline: none; border-color: #1a56db; }

    .kw-hints {
      margin-top: 8px;
      font-size: 12px;
      color: #6b7280;
    }
    .kw-hints span {
      display: inline-block;
      background: #f3f4f6;
      border-radius: 4px;
      padding: 2px 8px;
      margin: 2px 2px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .kw-hints span:hover { background: #e5e7eb; }

    /* ── 검색 기간 선택 ── */
    .period-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
      margin-bottom: 2px;
      flex-wrap: wrap;
    }

    .period-label {
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .period-btns {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .period-btn {
      padding: 5px 14px;
      border: 1.5px solid #d1d5db;
      border-radius: 99px;
      background: #fff;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      color: #6b7280;
      font-family: inherit;
      transition: all 0.15s;
    }

    .period-btn:hover { border-color: #93c5fd; color: #1a56db; background: #eff6ff; }
    .period-btn.active { border-color: #1a56db; background: #1a56db; color: #fff; font-weight: 700; }

    /* ── 소재 목록 ── */
    .section { display: none; }
    .section.visible { display: block; }

    .section-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px;
    }

    .section-title { font-size: 16px; font-weight: 700; color: #111827; }
    .section-sub   { font-size: 13px; color: #6b7280; margin-top: 2px; }

    .material-list { display: flex; flex-direction: column; gap: 10px; }

    .material-card {
      border: 2px solid #e5e7eb;
      border-radius: 10px; padding: 16px;
      cursor: pointer; transition: border-color 0.2s, background 0.2s;
      display: flex; gap: 14px; align-items: flex-start;
    }
    .material-card:hover { border-color: #93c5fd; background: #f8faff; }
    .material-card.selected { border-color: #1a56db; background: #eff6ff; }

    .material-radio {
      width: 20px; height: 20px; border-radius: 50%;
      border: 2px solid #d1d5db;
      flex-shrink: 0; margin-top: 2px;
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.2s;
    }
    .material-card.selected .material-radio { border-color: #1a56db; }
    .material-radio-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: #1a56db;
      display: none;
    }
    .material-card.selected .material-radio-dot { display: block; }

    .material-body { flex: 1; }
    .material-title { font-size: 15px; font-weight: 700; color: #111827; margin-bottom: 6px; line-height: 1.4; }
    .material-summary { font-size: 13px; color: #4b5563; line-height: 1.6; margin-bottom: 6px; }
    .material-url {
      font-size: 11px; color: #6b7280;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: 100%;
    }

    .material-date {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 5px;
    }

    .divider { border: none; border-top: 1.5px solid #e5e7eb; margin: 24px 0; }

    /* ── 결과 ── */
    .copy-banner {
      display: none; align-items: center; justify-content: space-between;
      background: #eff6ff; border: 1.5px solid #bfdbfe;
      border-radius: 8px; padding: 10px 16px; margin-bottom: 10px;
    }
    .copy-banner.visible { display: flex; }
    .copy-banner span { font-size: 13px; color: #1e40af; font-weight: 600; }

    .btn-copy-banner {
      padding: 7px 20px; background: #1a56db;
      color: #fff; border: none; border-radius: 6px;
      font-size: 14px; font-weight: 700; cursor: pointer;
      font-family: inherit; transition: background 0.15s;
    }
    .btn-copy-banner:hover { background: #1e429f; }
    .btn-copy-banner.copied { background: #059669; }

    .result-box {
      background: #f9fafb; border: 1.5px solid #e5e7eb;
      border-radius: 8px; min-height: 200px;
      padding: 20px; font-size: 15px; line-height: 1.8;
      color: #111827; white-space: pre-wrap; word-break: break-word;
    }
    .result-box.loading {
      display: flex; align-items: center; justify-content: center;
      color: #6b7280; font-size: 15px; gap: 10px;
    }
    .result-box.error { border-color: #fca5a5; background: #fff5f5; color: #b91c1c; }
    .result-box.empty {
      display: flex; align-items: center; justify-content: center;
      color: #9ca3af; font-size: 14px;
    }

    .spinner {
      width: 22px; height: 22px;
      border: 3px solid #d1d5db; border-top-color: #1a56db;
      border-radius: 50%;
      animation: spin 0.8s linear infinite; flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .char-count { font-size: 12px; color: #6b7280; text-align: right; margin-top: 6px; }
    .char-count.good { color: #059669; }

    .actions { display: flex; gap: 10px; margin-top: 14px; }
    .btn-secondary {
      flex: 1; padding: 10px;
      border: 1.5px solid #d1d5db; background: #fff;
      border-radius: 8px; font-size: 14px; font-weight: 600;
      cursor: pointer; font-family: inherit; color: #374151;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn-secondary:hover { background: #f3f4f6; border-color: #9ca3af; }
    .btn-secondary:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-copy.copied { color: #059669; border-color: #059669; }

    .badge {
      display: inline-block;
      font-size: 11px; font-weight: 700;
      padding: 2px 8px; border-radius: 99px;
      margin-bottom: 6px;
    }
    .badge-news    { background: #dbeafe; color: #1e40af; }
    .badge-youtube { background: #fee2e2; color: #991b1b; }

    .loading-card {
      background: #f9fafb; border: 1.5px solid #e5e7eb;
      border-radius: 10px; padding: 32px;
      display: flex; align-items: center; justify-content: center;
      gap: 12px; color: #6b7280; font-size: 15px;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>기사 소재 수집 및 작성 AI 직원</h1>
    <p>소재 검색 → 소재 선택 → 기사 작성 3단계로 팩트 중심 기사를 자동 생성합니다.</p>
  </div>

  <!-- 단계 표시 -->
  <div class="steps">
    <div class="step active" id="step1">
      <div class="step-num">1</div>
      <div class="step-label">소재 검색</div>
    </div>
    <div class="step-line" id="line1"></div>
    <div class="step" id="step2">
      <div class="step-num">2</div>
      <div class="step-label">소재 선택</div>
    </div>
    <div class="step-line" id="line2"></div>
    <div class="step" id="step3">
      <div class="step-num">3</div>
      <div class="step-label">기사 작성</div>
    </div>
  </div>

  <div class="body">

    <!-- STEP 1: 검색 -->
    <div class="section visible" id="sectionSearch">

      <!-- 경로 관리자 -->
      <div class="pm-header">
        <label style="margin:0">검색 경로</label>
        <span class="pm-count" id="pmCount">1 / 10</span>
      </div>

      <div class="pm-list" id="pmList"></div>

      <div class="pm-add-wrap">
        <button class="pm-add-btn" id="pmAddBtn" onclick="pmAddPath()">
          <span class="pm-add-btn-left">
            <span class="pm-add-icon">＋</span>
            입력창 추가
          </span>
          <span class="pm-add-hint" id="pmAddHint">1 / 10</span>
        </button>
      </div>

      <div class="pm-saved-hint" id="pmSavedHint"></div>

      <!-- 검색 키워드 -->
      <div class="kw-wrap">
        <label for="keywordInput" style="margin-bottom:8px;">검색 키워드</label>
        <input type="text" id="keywordInput" class="kw-input"
               placeholder="검색할 키워드를 입력하세요 (예: 정책 발표, 최신 뉴스)">
        <div class="kw-hints">
          예시:
          <span onclick="setKeyword('정부 정책 발표')">정부 정책 발표</span>
          <span onclick="setKeyword('복지 제도 변화')">복지 제도 변화</span>
          <span onclick="setKeyword('고용노동부 최신 정책')">고용노동부 최신 정책</span>
          <span onclick="setKeyword('교육부 보도자료')">교육부 보도자료</span>
        </div>
      </div>

      <!-- 검색 기간 -->
      <div class="period-wrap">
        <span class="period-label">검색 기간</span>
        <div class="period-btns" id="periodBtns">
          <button class="period-btn" data-period="today"     onclick="setPeriod('today')">오늘</button>
          <button class="period-btn" data-period="yesterday" onclick="setPeriod('yesterday')">어제</button>
          <button class="period-btn active" data-period="week" onclick="setPeriod('week')">최근 1주일</button>
          <button class="period-btn" data-period="month"    onclick="setPeriod('month')">최근 1개월</button>
          <button class="period-btn" data-period="all"      onclick="setPeriod('all')">전체</button>
        </div>
      </div>

      <button class="btn-primary" id="searchBtn" onclick="searchMaterials()">
        소재 검색 시작
      </button>
    </div>

    <!-- STEP 2: 소재 선택 -->
    <div class="section" id="sectionMaterials">
      <div class="section-header">
        <div>
          <div class="section-title" id="materialsTitle">검색 결과</div>
          <div class="section-sub">기사로 작성할 소재를 하나 선택하세요.</div>
        </div>
        <button class="btn-secondary" style="flex:none;padding:8px 16px;font-size:13px;" onclick="resetToSearch()">
          ← 다시 검색
        </button>
      </div>
      <div class="material-list" id="materialList"></div>
      <button class="btn-primary" id="generateBtn" style="margin-top:20px;" disabled onclick="generateArticle()">
        선택한 소재로 기사 작성
      </button>
    </div>

    <!-- STEP 3: 기사 결과 -->
    <div class="section" id="sectionArticle">
      <div class="section-header">
        <div>
          <div class="section-title" id="articleSectionTitle">기사 초안</div>
          <div class="section-sub" id="articleSourceTitle"></div>
        </div>
        <button class="btn-secondary" style="flex:none;padding:8px 16px;font-size:13px;" onclick="backToMaterials()">
          ← 소재 목록
        </button>
      </div>

      <div class="copy-banner" id="copyBanner">
        <span>기사 작성이 완료되었습니다.</span>
        <button class="btn-copy-banner" id="copyBannerBtn" onclick="copyArticle()">복사하기</button>
      </div>

      <div class="result-box empty" id="resultBox">기사 작성을 시작하면 여기에 결과가 표시됩니다.</div>
      <div class="char-count" id="charCount"></div>

      <div class="actions">
        <button class="btn-secondary btn-copy" id="copyBtn" disabled onclick="copyArticle()">복사하기</button>
        <button class="btn-secondary" id="retryBtn" disabled onclick="retryArticle()">다시 작성</button>
      </div>
    </div>

  </div>
</div>

<script>
  /* ────────────────────────────────────────
     경로 관리자
  ──────────────────────────────────────── */
  const PM_MAX   = 10;
  const PM_KEY   = 'aimax_paths';
  let pmPaths    = [];   // [{id, value, saved}]
  let pmNextId   = 1;
  let pmSelected = null; // selected path id

  function pmInit() {
    try {
      const raw = localStorage.getItem(PM_KEY);
      if (raw) pmPaths = JSON.parse(raw);
    } catch (e) {}

    if (pmPaths.length === 0) {
      pmPaths = [{ id: pmNextId++, value: '', saved: false }];
    } else {
      pmNextId = Math.max(...pmPaths.map(p => p.id)) + 1;
    }

    pmSelected = pmPaths[0].id;
    pmRender();
  }

  function pmRender() {
    const list = document.getElementById('pmList');
    list.innerHTML = '';

    pmPaths.forEach((p, i) => {
      const isSaved = p.saved && p.value.trim();
      const isSelected = p.id === pmSelected;

      const row = document.createElement('div');
      row.className = 'pm-row' + (isSelected ? ' selected' : '');
      row.dataset.id = p.id;

      row.innerHTML = `
        <span class="pm-num">${i + 1}</span>
        <input type="text"
               class="pm-input${isSaved ? ' saved' : ''}"
               placeholder="사이트 URL 또는 유튜브 채널 (예: https://youtube.com/@채널명)"
               value="${escapeAttr(p.value)}"
               data-pid="${p.id}">
        <button class="pm-save-btn${isSaved ? ' saved' : ''}" data-pid="${p.id}">
          ${isSaved ? '✓ 저장됨' : '저장'}
        </button>
        ${pmPaths.length > 1
          ? `<button class="pm-del-btn" data-pid="${p.id}" title="삭제">×</button>`
          : ''}
      `;

      const input   = row.querySelector('.pm-input');
      const saveBtn = row.querySelector('.pm-save-btn');
      const delBtn  = row.querySelector('.pm-del-btn');

      input.addEventListener('focus', () => pmSelect(p.id));
      input.addEventListener('input', () => pmOnInput(p.id, input.value));
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) searchMaterials();
      });

      saveBtn.addEventListener('click', () => pmSave(p.id));
      if (delBtn) delBtn.addEventListener('click', () => pmDelete(p.id));

      list.appendChild(row);
    });

    // 추가 버튼 상태
    const addBtn  = document.getElementById('pmAddBtn');
    const addHint = document.getElementById('pmAddHint');
    const full    = pmPaths.length >= PM_MAX;
    addBtn.disabled     = full;
    addHint.textContent = `${pmPaths.length} / ${PM_MAX}`;
    document.getElementById('pmCount').textContent = `${pmPaths.length} / ${PM_MAX}`;

    // 저장된 경로 힌트 (다른 저장된 경로 빠른 선택)
    pmRenderSavedHint();
  }

  function pmRenderSavedHint() {
    const saved = pmPaths.filter(p => p.saved && p.value.trim());
    const el    = document.getElementById('pmSavedHint');
    if (saved.length === 0) { el.innerHTML = ''; return; }

    const label = document.createElement('span');
    label.style.cssText = 'color:#6b7280;margin-right:4px;background:none;border:none;padding:0;cursor:default;';
    label.textContent = '저장된 경로:';

    el.innerHTML = '';
    el.appendChild(label);

    saved.forEach(p => {
      const tag = document.createElement('span');
      const short = p.value.length > 30 ? p.value.slice(0, 28) + '…' : p.value;
      tag.textContent = short;
      tag.title = p.value;
      tag.addEventListener('click', () => {
        pmSelect(p.id);
        searchMaterials(); // keyword 입력값도 함께 전송됨
      });
      el.appendChild(tag);
    });
  }

  function pmSelect(id) {
    pmSelected = id;
    document.querySelectorAll('.pm-row').forEach(r => {
      const rid = Number(r.dataset.id);
      r.classList.toggle('selected', rid === id);
      r.querySelector('.pm-num').style.background = rid === id ? '#1a56db' : '';
      r.querySelector('.pm-num').style.color      = rid === id ? '#fff'    : '';
    });
  }

  function pmOnInput(id, value) {
    const p = pmPaths.find(p => p.id === id);
    if (!p) return;
    p.value = value;
    p.saved = false;

    const row = document.querySelector(`.pm-row[data-id="${id}"]`);
    if (!row) return;
    row.querySelector('.pm-input').classList.remove('saved');
    const btn = row.querySelector('.pm-save-btn');
    btn.textContent = '저장';
    btn.classList.remove('saved');
  }

  function pmSave(id) {
    const p = pmPaths.find(p => p.id === id);
    if (!p) return;

    const row   = document.querySelector(`.pm-row[data-id="${id}"]`);
    const input = row ? row.querySelector('.pm-input') : null;
    const val   = input ? input.value.trim() : p.value.trim();

    if (!val) {
      if (input) {
        input.focus();
        input.style.borderColor = '#ef4444';
        setTimeout(() => { input.style.borderColor = ''; }, 900);
      }
      return;
    }

    p.value = val;
    p.saved = true;

    try { localStorage.setItem(PM_KEY, JSON.stringify(pmPaths)); } catch (e) {}
    pmRender();

    // focus 유지
    setTimeout(() => {
      const inp = document.querySelector(`.pm-row[data-id="${id}"] .pm-input`);
      if (inp) inp.focus();
    }, 30);
  }

  function pmDelete(id) {
    if (pmPaths.length <= 1) return;
    pmPaths = pmPaths.filter(p => p.id !== id);
    if (pmSelected === id) pmSelected = pmPaths[0].id;
    try { localStorage.setItem(PM_KEY, JSON.stringify(pmPaths)); } catch (e) {}
    pmRender();
  }

  function pmAddPath() {
    if (pmPaths.length >= PM_MAX) return;
    const newId = pmNextId++;
    pmPaths.push({ id: newId, value: '', saved: false });
    pmSelected = newId;
    pmRender();

    setTimeout(() => {
      const rows  = document.querySelectorAll('.pm-row');
      const last  = rows[rows.length - 1];
      if (last) {
        last.classList.add('new');
        last.querySelector('.pm-input').focus();
        setTimeout(() => last.classList.remove('new'), 400);
        last.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }, 40);
  }

  /* ────────────────────────────────────────
     검색 기간
  ──────────────────────────────────────── */
  let selectedPeriod = 'week';

  function setPeriod(period) {
    selectedPeriod = period;
    document.querySelectorAll('.period-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.period === period);
    });
  }

  const PERIOD_LABEL = {
    today:     '오늘',
    yesterday: '어제',
    week:      '최근 1주일',
    month:     '최근 1개월',
    all:       '전체',
  };

  /* ────────────────────────────────────────
     검색 / 기사 흐름
  ──────────────────────────────────────── */
  let selectedMaterial = null;
  let articleText = "";

  function showSection(id) {
    ["sectionSearch", "sectionMaterials", "sectionArticle"].forEach(s => {
      document.getElementById(s).classList.remove("visible");
    });
    document.getElementById(id).classList.add("visible");
  }

  function setStep(active) {
    for (let i = 1; i <= 3; i++) {
      const el = document.getElementById("step" + i);
      el.classList.remove("active", "done");
      if (i < active) el.classList.add("done");
      else if (i === active) el.classList.add("active");
    }
    for (let i = 1; i <= 2; i++) {
      document.getElementById("line" + i).classList.toggle("done", i < active);
    }
  }

  function setKeyword(text) {
    document.getElementById('keywordInput').value = text;
    document.getElementById('keywordInput').focus();
  }

  async function searchMaterials() {
    // 선택된 경로 값 가져오기
    let path = '';
    const selPath = pmPaths.find(p => p.id === pmSelected);
    if (selPath && selPath.value.trim()) {
      path = selPath.value.trim();
    } else {
      const first = pmPaths.find(p => p.value.trim());
      if (first) { pmSelect(first.id); path = first.value.trim(); }
    }

    const keyword = document.getElementById('keywordInput').value.trim();

    if (!path && !keyword) {
      alert('검색 경로 또는 키워드를 입력해주세요.');
      document.getElementById('keywordInput').focus();
      return;
    }

    selectedMaterial = null;

    const searchBtn = document.getElementById("searchBtn");
    searchBtn.disabled = true;
    searchBtn.textContent = "검색 중...";

    const materialList = document.getElementById("materialList");
    materialList.innerHTML = '<div class="loading-card"><div class="spinner"></div> 소재를 검색하고 있습니다...</div>';

    showSection("sectionMaterials");
    setStep(2);
    const displayText = keyword || path;
    const periodText  = PERIOD_LABEL[selectedPeriod] || '전체';
    document.getElementById("materialsTitle").textContent = `"${displayText}" 검색 결과 · ${periodText}`;
    document.getElementById("generateBtn").disabled = true;

    try {
      const res  = await fetch("/search", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ path, keyword, period: selectedPeriod }),
      });
      const data = await res.json();

      if (!res.ok || data.error) {
        materialList.innerHTML = `<div class="loading-card" style="color:#b91c1c;">${data.error || "오류가 발생했습니다."}</div>`;
        return;
      }
      renderMaterials(data.materials);
    } catch (e) {
      materialList.innerHTML = '<div class="loading-card" style="color:#b91c1c;">서버 연결에 실패했습니다.</div>';
    } finally {
      searchBtn.disabled = false;
      searchBtn.textContent = "소재 검색 시작";
    }
  }

  function renderMaterials(materials) {
    const list = document.getElementById("materialList");
    list.innerHTML = "";
    materials.forEach((m, i) => {
      const isYoutube  = m.source_type === "youtube";
      const badgeClass = isYoutube ? "badge-youtube" : "badge-news";
      const badgeLabel = isYoutube ? "▶ YouTube" : "📰 뉴스";
      const card = document.createElement("div");
      card.className = "material-card";
      card.dataset.index = i;
      const dateStr = m.pub_date ? `<div class="material-date">📅 ${escapeHtml(m.pub_date)}</div>` : '';
      card.innerHTML = `
        <div class="material-radio"><div class="material-radio-dot"></div></div>
        <div class="material-body">
          <span class="badge ${badgeClass}">${badgeLabel} · ${escapeHtml(m.source_name || "")}</span>
          <div class="material-title">${escapeHtml(m.title)}</div>
          <div class="material-summary">${escapeHtml(m.summary)}</div>
          <div class="material-url">${escapeHtml(m.url || "")}</div>
          ${dateStr}
        </div>`;
      card.addEventListener("click", () => selectMaterial(card, m));
      list.appendChild(card);
    });
  }

  function selectMaterial(card, material) {
    document.querySelectorAll(".material-card").forEach(c => c.classList.remove("selected"));
    card.classList.add("selected");
    selectedMaterial = material;
    document.getElementById("generateBtn").disabled = false;
  }

  function resetToSearch() {
    showSection("sectionSearch");
    setStep(1);
  }

  function backToMaterials() {
    showSection("sectionMaterials");
    setStep(2);
  }

  async function generateArticle() {
    if (!selectedMaterial) return;

    showSection("sectionArticle");
    setStep(3);

    const resultBox = document.getElementById("resultBox");
    const copyBtn   = document.getElementById("copyBtn");
    const retryBtn  = document.getElementById("retryBtn");
    const charCount = document.getElementById("charCount");

    const isYoutube = selectedMaterial.source_type === "youtube";
    document.getElementById("articleSourceTitle").textContent = selectedMaterial.title;
    document.getElementById("copyBanner").classList.remove("visible");
    resultBox.className = "result-box loading";
    resultBox.innerHTML = isYoutube
      ? '<div class="spinner"></div> 릴스 스크립트를 작성하고 있습니다...'
      : '<div class="spinner"></div> 기사를 작성하고 있습니다... (1~2분 소요)';
    copyBtn.disabled  = true;
    retryBtn.disabled = true;
    charCount.textContent = "";
    articleText = "";

    try {
      const res  = await fetch("/generate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          material_title:   selectedMaterial.title,
          material_summary: selectedMaterial.summary,
          material_url:     selectedMaterial.url || "",
          source_type:      selectedMaterial.source_type || "news",
          source_name:      selectedMaterial.source_name || "",
        }),
      });
      const data = await res.json();

      if (!res.ok || data.error) {
        resultBox.className = "result-box error";
        resultBox.textContent = data.error || "알 수 없는 오류가 발생했습니다.";
        retryBtn.disabled = false;
        return;
      }

      articleText = data.article || "";
      const contentType = data.content_type || "article";
      const isReels = contentType === "reels";

      document.getElementById("articleSectionTitle").textContent =
        isReels ? "릴스 스크립트 초안" : "기사 초안";

      resultBox.className = "result-box";
      resultBox.textContent = articleText;

      const len = articleText.replace(/\s/g, "").length;
      if (isReels) {
        charCount.textContent = `글자 수: ${len.toLocaleString()}자 (권장: 300~450자)`;
        charCount.className   = len >= 300 && len <= 450 ? "char-count good" : "char-count";
      } else {
        charCount.textContent = `글자 수: ${len.toLocaleString()}자`;
        charCount.className   = len >= 2000 ? "char-count good" : "char-count";
      }

      document.getElementById("copyBanner").classList.add("visible");
      copyBtn.disabled  = false;
      retryBtn.disabled = false;
    } catch (e) {
      resultBox.className = "result-box error";
      resultBox.textContent = "서버 연결에 실패했습니다.";
      retryBtn.disabled = false;
    }
  }

  function retryArticle() {
    if (selectedMaterial) generateArticle();
  }

  function copyArticle() {
    if (!articleText) return;
    navigator.clipboard.writeText(articleText).then(() => {
      const bannerBtn = document.getElementById("copyBannerBtn");
      const btn       = document.getElementById("copyBtn");
      bannerBtn.textContent = "복사 완료!"; bannerBtn.classList.add("copied");
      btn.textContent       = "복사 완료!"; btn.classList.add("copied");
      setTimeout(() => {
        bannerBtn.textContent = "복사하기"; bannerBtn.classList.remove("copied");
        btn.textContent       = "복사하기"; btn.classList.remove("copied");
      }, 2000);
    });
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function escapeAttr(str) {
    return String(str || '')
      .replace(/&/g, "&amp;").replace(/"/g, "&quot;")
      .replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // 초기화
  pmInit();
</script>
</body>
</html>
