<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>기사 소재 수집 및 작성 AI 직원</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 16px;
    }

    .container {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 820px;
      overflow: hidden;
    }

    .header {
      background: #1a56db;
      color: #fff;
      padding: 24px 32px;
    }

    .header h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    .header p  { font-size: 13px; opacity: 0.85; }

    /* ── 단계 표시 ── */
    .steps {
      display: flex;
      align-items: center;
      padding: 20px 32px;
      border-bottom: 1px solid #e5e7eb;
      gap: 0;
    }

    .step {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
    }

    .step-num {
      width: 28px; height: 28px;
      border-radius: 50%;
      border: 2px solid #d1d5db;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700;
      color: #9ca3af;
      flex-shrink: 0;
      transition: all 0.3s;
    }

    .step-label { font-size: 13px; color: #9ca3af; font-weight: 500; transition: all 0.3s; }

    .step-line {
      flex: 1;
      height: 2px;
      background: #e5e7eb;
      margin: 0 8px;
      transition: background 0.3s;
    }

    .step.active   .step-num   { border-color: #1a56db; background: #1a56db; color: #fff; }
    .step.active   .step-label { color: #1a56db; font-weight: 700; }
    .step.done     .step-num   { border-color: #059669; background: #059669; color: #fff; }
    .step.done     .step-label { color: #059669; }
    .step-line.done { background: #059669; }

    /* ── 공통 ── */
    .body { padding: 28px 32px; }

    label {
      display: block;
      font-size: 14px; font-weight: 600; color: #374151;
      margin-bottom: 8px;
    }

    textarea {
      width: 100%; padding: 12px 14px;
      border: 1.5px solid #d1d5db; border-radius: 8px;
      font-size: 15px; font-family: inherit;
      resize: vertical; min-height: 72px; line-height: 1.5;
      transition: border-color 0.2s;
    }

    textarea:focus { outline: none; border-color: #1a56db; }

    .hints { margin-top: 8px; font-size: 12px; color: #6b7280; }
    .hints span {
      display: inline-block;
      background: #f3f4f6; border-radius: 4px;
      padding: 2px 8px; margin: 2px 2px;
      cursor: pointer; transition: background 0.15s;
    }
    .hints span:hover { background: #e5e7eb; }

    .btn-primary {
      margin-top: 18px; width: 100%;
      padding: 14px; background: #1a56db;
      color: #fff; border: none; border-radius: 8px;
      font-size: 16px; font-weight: 700; cursor: pointer;
      font-family: inherit; transition: background 0.2s;
    }
    .btn-primary:hover:not(:disabled) { background: #1e429f; }
    .btn-primary:disabled { background: #93c5fd; cursor: not-allowed; }

    /* ── 소재 목록 ── */
    .section { display: none; }
    .section.visible { display: block; }

    .section-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px;
    }

    .section-title { font-size: 16px; font-weight: 700; color: #111827; }
    .section-sub   { font-size: 13px; color: #6b7280; margin-top: 2px; }

    .material-list { display: flex; flex-direction: column; gap: 10px; }

    .material-card {
      border: 2px solid #e5e7eb;
      border-radius: 10px; padding: 16px;
      cursor: pointer; transition: border-color 0.2s, background 0.2s;
      display: flex; gap: 14px; align-items: flex-start;
    }
    .material-card:hover { border-color: #93c5fd; background: #f8faff; }
    .material-card.selected { border-color: #1a56db; background: #eff6ff; }

    .material-radio {
      width: 20px; height: 20px; border-radius: 50%;
      border: 2px solid #d1d5db;
      flex-shrink: 0; margin-top: 2px;
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.2s;
    }
    .material-card.selected .material-radio { border-color: #1a56db; }
    .material-radio-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: #1a56db;
      display: none;
    }
    .material-card.selected .material-radio-dot { display: block; }

    .material-body { flex: 1; }
    .material-title { font-size: 15px; font-weight: 700; color: #111827; margin-bottom: 6px; line-height: 1.4; }
    .material-summary { font-size: 13px; color: #4b5563; line-height: 1.6; margin-bottom: 6px; }
    .material-url {
      font-size: 11px; color: #6b7280;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: 100%;
    }

    .divider { border: none; border-top: 1.5px solid #e5e7eb; margin: 24px 0; }

    /* ── 결과 ── */
    .copy-banner {
      display: none; align-items: center; justify-content: space-between;
      background: #eff6ff; border: 1.5px solid #bfdbfe;
      border-radius: 8px; padding: 10px 16px; margin-bottom: 10px;
    }
    .copy-banner.visible { display: flex; }
    .copy-banner span { font-size: 13px; color: #1e40af; font-weight: 600; }

    .btn-copy-banner {
      padding: 7px 20px; background: #1a56db;
      color: #fff; border: none; border-radius: 6px;
      font-size: 14px; font-weight: 700; cursor: pointer;
      font-family: inherit; transition: background 0.15s;
    }
    .btn-copy-banner:hover { background: #1e429f; }
    .btn-copy-banner.copied { background: #059669; }

    .result-box {
      background: #f9fafb; border: 1.5px solid #e5e7eb;
      border-radius: 8px; min-height: 200px;
      padding: 20px; font-size: 15px; line-height: 1.8;
      color: #111827; white-space: pre-wrap; word-break: break-word;
    }
    .result-box.loading {
      display: flex; align-items: center; justify-content: center;
      color: #6b7280; font-size: 15px; gap: 10px;
    }
    .result-box.error { border-color: #fca5a5; background: #fff5f5; color: #b91c1c; }
    .result-box.empty {
      display: flex; align-items: center; justify-content: center;
      color: #9ca3af; font-size: 14px;
    }

    .spinner {
      width: 22px; height: 22px;
      border: 3px solid #d1d5db; border-top-color: #1a56db;
      border-radius: 50%;
      animation: spin 0.8s linear infinite; flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .char-count { font-size: 12px; color: #6b7280; text-align: right; margin-top: 6px; }
    .char-count.good { color: #059669; }

    .actions { display: flex; gap: 10px; margin-top: 14px; }
    .btn-secondary {
      flex: 1; padding: 10px;
      border: 1.5px solid #d1d5db; background: #fff;
      border-radius: 8px; font-size: 14px; font-weight: 600;
      cursor: pointer; font-family: inherit; color: #374151;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn-secondary:hover { background: #f3f4f6; border-color: #9ca3af; }
    .btn-secondary:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-copy.copied { color: #059669; border-color: #059669; }

    .loading-card {
      background: #f9fafb; border: 1.5px solid #e5e7eb;
      border-radius: 10px; padding: 32px;
      display: flex; align-items: center; justify-content: center;
      gap: 12px; color: #6b7280; font-size: 15px;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>기사 소재 수집 및 작성 AI 직원</h1>
    <p>소재 검색 → 소재 선택 → 기사 작성 3단계로 팩트 중심 기사를 자동 생성합니다.</p>
  </div>

  <!-- 단계 표시 -->
  <div class="steps">
    <div class="step active" id="step1">
      <div class="step-num">1</div>
      <div class="step-label">소재 검색</div>
    </div>
    <div class="step-line" id="line1"></div>
    <div class="step" id="step2">
      <div class="step-num">2</div>
      <div class="step-label">소재 선택</div>
    </div>
    <div class="step-line" id="line2"></div>
    <div class="step" id="step3">
      <div class="step-num">3</div>
      <div class="step-label">기사 작성</div>
    </div>
  </div>

  <div class="body">

    <!-- STEP 1: 검색 -->
    <div class="section visible" id="sectionSearch">
      <label for="query">검색 키워드 또는 사이트/채널 입력</label>
      <textarea id="query" placeholder="예: 정부 정책 발표&#10;예: 복지 제도 변화&#10;예: 고용노동부 최신 정책"></textarea>
      <div class="hints">
        예시 클릭:
        <span onclick="setQuery('정부 정책 발표')">정부 정책 발표</span>
        <span onclick="setQuery('복지 제도 변화')">복지 제도 변화</span>
        <span onclick="setQuery('고용노동부 최신 정책')">고용노동부 최신 정책</span>
        <span onclick="setQuery('교육부 보도자료')">교육부 보도자료</span>
      </div>
      <button class="btn-primary" id="searchBtn" onclick="searchMaterials()">
        소재 검색 시작
      </button>
    </div>

    <!-- STEP 2: 소재 선택 -->
    <div class="section" id="sectionMaterials">
      <div class="section-header">
        <div>
          <div class="section-title" id="materialsTitle">검색 결과</div>
          <div class="section-sub">기사로 작성할 소재를 하나 선택하세요.</div>
        </div>
        <button class="btn-secondary" style="flex:none;padding:8px 16px;font-size:13px;" onclick="resetToSearch()">
          ← 다시 검색
        </button>
      </div>
      <div class="material-list" id="materialList"></div>
      <button class="btn-primary" id="generateBtn" style="margin-top:20px;" disabled onclick="generateArticle()">
        선택한 소재로 기사 작성
      </button>
    </div>

    <!-- STEP 3: 기사 결과 -->
    <div class="section" id="sectionArticle">
      <div class="section-header">
        <div>
          <div class="section-title">기사 초안</div>
          <div class="section-sub" id="articleSourceTitle"></div>
        </div>
        <button class="btn-secondary" style="flex:none;padding:8px 16px;font-size:13px;" onclick="backToMaterials()">
          ← 소재 목록
        </button>
      </div>

      <div class="copy-banner" id="copyBanner">
        <span>기사 작성이 완료되었습니다.</span>
        <button class="btn-copy-banner" id="copyBannerBtn" onclick="copyArticle()">복사하기</button>
      </div>

      <div class="result-box empty" id="resultBox">기사 작성을 시작하면 여기에 결과가 표시됩니다.</div>
      <div class="char-count" id="charCount"></div>

      <div class="actions">
        <button class="btn-secondary btn-copy" id="copyBtn" disabled onclick="copyArticle()">복사하기</button>
        <button class="btn-secondary" id="retryBtn" disabled onclick="retryArticle()">다시 작성</button>
      </div>
    </div>

  </div>
</div>

<script>
  let selectedMaterial = null;
  let articleText = "";
  let lastQuery = "";

  function setQuery(text) {
    document.getElementById("query").value = text;
    document.getElementById("query").focus();
  }

  function showSection(id) {
    ["sectionSearch", "sectionMaterials", "sectionArticle"].forEach(s => {
      document.getElementById(s).classList.remove("visible");
    });
    document.getElementById(id).classList.add("visible");
  }

  function setStep(active) {
    // active: 1, 2, or 3
    for (let i = 1; i <= 3; i++) {
      const el = document.getElementById("step" + i);
      el.classList.remove("active", "done");
      if (i < active) el.classList.add("done");
      else if (i === active) el.classList.add("active");
    }
    for (let i = 1; i <= 2; i++) {
      const line = document.getElementById("line" + i);
      line.classList.toggle("done", i < active);
    }
  }

  async function searchMaterials() {
    const query = document.getElementById("query").value.trim();
    if (!query) { alert("검색 키워드를 입력해주세요."); return; }

    lastQuery = query;
    selectedMaterial = null;

    const searchBtn = document.getElementById("searchBtn");
    searchBtn.disabled = true;
    searchBtn.textContent = "검색 중...";

    const materialList = document.getElementById("materialList");
    materialList.innerHTML = '<div class="loading-card"><div class="spinner"></div> 정부 공식 자료에서 소재를 검색하고 있습니다...</div>';

    showSection("sectionMaterials");
    setStep(2);
    document.getElementById("materialsTitle").textContent = `"${query}" 검색 결과`;
    document.getElementById("generateBtn").disabled = true;

    try {
      const res = await fetch("/search", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query }),
      });
      const data = await res.json();

      if (!res.ok || data.error) {
        materialList.innerHTML = `<div class="loading-card" style="color:#b91c1c;">${data.error || "오류가 발생했습니다."}</div>`;
        return;
      }

      renderMaterials(data.materials);
    } catch (e) {
      materialList.innerHTML = '<div class="loading-card" style="color:#b91c1c;">서버 연결에 실패했습니다.</div>';
    } finally {
      searchBtn.disabled = false;
      searchBtn.textContent = "소재 검색 시작";
    }
  }

  function renderMaterials(materials) {
    const list = document.getElementById("materialList");
    list.innerHTML = "";
    materials.forEach((m, i) => {
      const card = document.createElement("div");
      card.className = "material-card";
      card.dataset.index = i;
      card.innerHTML = `
        <div class="material-radio"><div class="material-radio-dot"></div></div>
        <div class="material-body">
          <div class="material-title">${escapeHtml(m.title)}</div>
          <div class="material-summary">${escapeHtml(m.summary)}</div>
          <div class="material-url">${escapeHtml(m.url || "")}</div>
        </div>`;
      card.addEventListener("click", () => selectMaterial(card, m));
      list.appendChild(card);
    });
  }

  function selectMaterial(card, material) {
    document.querySelectorAll(".material-card").forEach(c => c.classList.remove("selected"));
    card.classList.add("selected");
    selectedMaterial = material;
    document.getElementById("generateBtn").disabled = false;
  }

  function resetToSearch() {
    showSection("sectionSearch");
    setStep(1);
  }

  function backToMaterials() {
    showSection("sectionMaterials");
    setStep(2);
  }

  async function generateArticle() {
    if (!selectedMaterial) return;

    showSection("sectionArticle");
    setStep(3);

    const resultBox = document.getElementById("resultBox");
    const copyBtn = document.getElementById("copyBtn");
    const retryBtn = document.getElementById("retryBtn");
    const charCount = document.getElementById("charCount");

    document.getElementById("articleSourceTitle").textContent = selectedMaterial.title;
    document.getElementById("copyBanner").classList.remove("visible");
    resultBox.className = "result-box loading";
    resultBox.innerHTML = '<div class="spinner"></div> 기사를 작성하고 있습니다... (1~2분 소요)';
    copyBtn.disabled = true;
    retryBtn.disabled = true;
    charCount.textContent = "";
    articleText = "";

    try {
      const res = await fetch("/generate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          material_title: selectedMaterial.title,
          material_summary: selectedMaterial.summary,
          material_url: selectedMaterial.url || "",
        }),
      });
      const data = await res.json();

      if (!res.ok || data.error) {
        resultBox.className = "result-box error";
        resultBox.textContent = data.error || "알 수 없는 오류가 발생했습니다.";
        retryBtn.disabled = false;
        return;
      }

      articleText = data.article || "";
      resultBox.className = "result-box";
      resultBox.textContent = articleText;

      const len = articleText.replace(/\s/g, "").length;
      charCount.textContent = `글자 수: ${len.toLocaleString()}자`;
      charCount.className = len >= 2000 ? "char-count good" : "char-count";

      document.getElementById("copyBanner").classList.add("visible");
      copyBtn.disabled = false;
      retryBtn.disabled = false;
    } catch (e) {
      resultBox.className = "result-box error";
      resultBox.textContent = "서버 연결에 실패했습니다.";
      retryBtn.disabled = false;
    }
  }

  function retryArticle() {
    if (selectedMaterial) generateArticle();
  }

  function copyArticle() {
    if (!articleText) return;
    navigator.clipboard.writeText(articleText).then(() => {
      const bannerBtn = document.getElementById("copyBannerBtn");
      const btn = document.getElementById("copyBtn");
      bannerBtn.textContent = "복사 완료!";
      bannerBtn.classList.add("copied");
      btn.textContent = "복사 완료!";
      btn.classList.add("copied");
      setTimeout(() => {
        bannerBtn.textContent = "복사하기";
        bannerBtn.classList.remove("copied");
        btn.textContent = "복사하기";
        btn.classList.remove("copied");
      }, 2000);
    });
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  document.getElementById("query").addEventListener("keydown", e => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) searchMaterials();
  });
</script>
</body>
</html>
